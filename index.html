    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                950: '#0a0a0a',
              }
            },
            fontFamily: {
              inter: ['Inter', 'sans-serif'],
            },
            animation: {
              'tilt': 'tilt 10s infinite linear',
              'sun-pass': 'sun-pass 5s infinite ease-in-out',
            },
            keyframes: {
              tilt: {
                '0%, 50%, 100%': { transform: 'rotate(0deg)' },
                '25%': { transform: 'rotate(1deg)' },
                '75%': { transform: 'rotate(-1deg)' },
              },

    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        overflow-x: hidden;
      }
      
      /* 
         Animated Gradient Backgrounds - PURPLE RADIAL MIRRORED THEME 
         Cria um efeito de "pulmão" ou espelho onde o centro irradia
      */
      .animate-gradient-dark {
        background-color: #05000a; /* Almost Black base */
        background-image: 
          radial-gradient(circle at 50% 50%, #4c1d95 0%, transparent 60%),
          radial-gradient(circle at 100% 0%, #3b0764 0%, transparent 50%),
          radial-gradient(circle at 0% 100%, #3b0764 0%, transparent 50%);
        background-size: 150% 150%;
        animation: mirror-pulse 8s ease-in-out infinite alternate;
      }

      .animate-gradient-light {
        background-color: #fdf4ff;
        background-image: 
          radial-gradient(circle at 50% 50%, #e9d5ff 0%, transparent 70%),
          radial-gradient(circle at 0% 0%, #f3e8ff 0%, transparent 50%),
          radial-gradient(circle at 100% 100%, #f3e8ff 0%, transparent 50%);
        background-size: 150% 150%;
        animation: mirror-pulse 8s ease-in-out infinite alternate;
      }

      @keyframes mirror-pulse {
        0% {
          background-position: 50% 50%;
          background-size: 120% 120%;
        }
        100% {
          background-position: 50% 50%;
          background-size: 160% 160%;
        }
      }

      /* Shimmer animation for cards */
      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }
      .animate-shimmer {
        animation: shimmer 2s infinite;
      }

      /* Custom scrollbar - Purple Tint */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(168, 85, 247, 0.3); /* Purple tint */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.5); }
    </style>
